            $ref: '#/components/schemas/PlaceOfBirthDetails'
        gender:
          type: string
        is_deceased:
          type: boolean
        associated_entity_details:
          $ref: '#/components/schemas/AssociatedEntityDetails'
        icon_hints:
          type: array
          items:
            $ref: '#/components/schemas/IconHintVo'
        content_sets:
          type: array
          items:
            type: string
        email_addresses:
          type: array
          items:
            type: string
    Links:
      type: object
      properties:
        self:
          type: string
          format: uri
    BasicAttributesV27:
      type: object

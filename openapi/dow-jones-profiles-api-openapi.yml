            attributes:
              $ref: '#/components/schemas/ProfileAttributes'
            meta:
              $ref: '#/components/schemas/Meta'
    EmailVo:
      type: object
      properties:
        email_address:
          type: string
    StateOwnedCompanyDetailsV27:
      type: object
      properties:
        board_appointing_control:

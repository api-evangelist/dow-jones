        past_ownerships:
          type: array
          items:
            $ref: '#/components/schemas/StateOwnershipDetailV27'
    ImageDetail:
      type: object
      properties:
        external_url:
          type: string
        resource_url:
          type: string
        image_id:
          type: string
    PhoneDetailsVo:
      type: object
      properties:
        type:
          type: string
        number:
          type: string
    AdverseMediaCaseRowDetails:
      type: object
      properties:
        content_type:
          type: string
        parent_content_type:
          type: string
        government_action:
          type: string
        monetary_value_detail:
          $ref: '#/components/schemas/MonetaryValueDetail'
        adverse_media_source_details:

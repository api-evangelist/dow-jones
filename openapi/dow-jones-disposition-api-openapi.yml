        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      security:
      - basicAuth: []
      parameters:
      - name: disposition_id
        in: path
        description: Identifier of the historical disposition
        required: true
        schema:
          type: integer

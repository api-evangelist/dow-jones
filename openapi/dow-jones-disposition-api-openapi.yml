        '404':
          description: Historical disposition not found for the given disposition_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  statusCode:
                    type: integer
                    description: HTTP status code
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  statusCode:
                    type: integer
                    description: HTTP status code
    delete:

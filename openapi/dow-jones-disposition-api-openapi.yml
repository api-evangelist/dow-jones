  /disposition/bulk:
    post:
      operationId: dispositionBulkDelete
      tags:
      - Disposition
      summary: Bulk delete historical dispositions
      description: 'Bulk delete historical dispositions by list of disposition IDs ### Rate Limits

        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      security:
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: integer
                    minimum: 1
                  description: Array of disposition IDs to delete
                  example:
                  - 41
                  - 42
            example:
              items:
              - 41
              - 42
      responses:
        '200':
          description: Bulk delete completed (may include partial failures)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Number of successful delete operations
                    example: 1
                  failed:
                    type: integer
                    description: Number of failed delete operations
                    example: 1
                  results:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        required:
                        - dispositionId
                        - success
                        properties:
                          dispositionId:
                            type: integer
                            description: Unique disposition identifier
                            example: 41
                          success:
                            const: true
                            description: Always true when the delete succeeded for this item
                            example: true
                      - type: object
                        required:
                        - dispositionId
                        - success
                        - error
                        properties:
                          dispositionId:
                            type: integer
                            description: Unique disposition identifier
                            example: 42
                          success:
                            const: false
                            description: Always false when the delete failed for this item
                            example: false
                          error:
                            type: string
                            description: Error message for this failed delete
                            example: Disposition with id 42 not found
                    description: Detailed results for each item in the request
                example:
                  success: 1
                  failed: 1
                  results:
                  - dispositionId: 41
                    success: true
                  - dispositionId: 42
                    success: false
                    error: Disposition with id 42 not found
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  statusCode:
                    type: integer
                    description: HTTP status code
        '401':
          description: Not authorized to use this endpoint
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  statusCode:
                    type: integer
                    description: HTTP status code
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication is the preferred authentication method, and should be used for new integrations.  Contact support to request a service account.
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication is supported for existing users, but is deprecated.  Existing users are encouraged to contact support for a dedicated service account and switch to JWT authentication.

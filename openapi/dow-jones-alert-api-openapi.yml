  /alert/assign:
    post:
      summary: Bulk assign alerts
      description: 'Bulk assign alerts to the specified user, optionally changing the status of the alerts to the specified status.

        NOTE: Alerts can only be assigned if they are eligible for assignment to the specified user in the specified status according to the workflow configuration.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.


        <!-- operational-characteristics:start -->


        ### Operational characteristics


        Values below are measured from production traffic. Only collected values are shown.


        **Latency distribution**


        Latency values are shown as milliseconds below 1 s, seconds with one decimal place below 1 min, otherwise as M:SS (min).


        | Metric | Value |

        | --- | --- |

        | Median | 99 ms |

        | 90th percentile | 230 ms |

        | 95th percentile | 397 ms |

        | 98th percentile | 967 ms |

        | 99th percentile | 1.7 s |

        <!-- operational-characteristics:end -->

        '
      operationId: alertBulkAssign
      tags:
      - Alert
      x-operational-characteristics:
        description: 'Operational characteristics from production log analysis (generatedAt: 2026-06-16T10:56:29.271Z).

          '
        latencyDistribution:
          median: 98.43
          p90: 229.51
          p95: 396.14
          p98: 966.32
          p99: 1665.62
          sampleSize: 1930
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                description: Details of the users to be assigned / unassigned and the optional new status
                required:
                - users
                properties:
                  users:
                    type: object
                    description: The users to be added / removed from the assignment. Note that one one user can be assigned to an alert at a time.
                    oneOf:
                    - required:
                      - add
                      - remove
                    - required:
                      - addExternalIds
                      - remove
                    - required:
                      - add
                      - removeExternalIds
                    - required:
                      - addExternalIds
                      - removeExternalIds
                    required:
                    - add
                    - remove
                    - addExternalIds
                    - removeExternalIds
                    properties:
                      add:
                        type: array
                        description: internal user id to add. Cannot be used in conjunction with addExternalIds.
                        maxlength: 1
                        items:
                          type: number
                          example: 10006
                      addExternalIds:
                        type: array
                        description: external user id to add. Cannot be used in conjunction with add.
                        maxlength: 1
                        items:
                          type: string
                          example: john.smith@ripjar.com
                      remove:
                        type: array
                        description: internal user id to remove. Cannot be used in conjunction with removeExternalIds.
                        maxlength: 1
                        items:
                          type: number
                          example: 10005
                      removeExternalIds:
                        type: array
                        description: external user id to remove. Cannot be used in conjunction with remove.
                        maxlength: 1
                        items:
                          type: string
                          example: john.smith@ripjar.com
                  newStatus:
                    type: object
                    description: New status
                    properties:
                      status:
                        type: integer
                        description: New status code
              - type: object
                required:
                - ids
                properties:
                  ids:
                    type: array
                    items:
                      type: number
                      example: 11001

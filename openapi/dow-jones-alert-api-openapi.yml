    post:
      summary: Update status/assignment of an alert
      description: 'Update status and optionally the assigned user of an alert. NOTE: Alerts can only be assigned or change status if they are eligible for assignment to the specified user in the specified status according to the workflow configuration. ### Rate Limits

        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.


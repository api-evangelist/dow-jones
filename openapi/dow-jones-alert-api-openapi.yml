                        description: Details of the user currently assigned to the alert
                        type: array
                        example:
                        - username: John Smith
                          email: john.smith@ripjar.com
                          externalId: john.smith@ripjar.com
                          mobile: 01234567890
                          roles:
                          - ROLE_1

                                  roles:
                                    type: array
                                    items:
                                      type: string
                                    description: 'A list of the user roles that this user has.

                                      Labyrinth Screening makes use of defined user roles to control the actions a user may perform and to tailor the interface to the needs of particular users.

                                      Each role is made up of a set of permissions which provide fine grained control over the actions a user can perform. Roles can be configured to match the business roles required by the users of the Screening system.

                                      These permissions used by the Screening system are described in the Ripjar Security Implementation document.

                                      When users are loaded into the system, each user account should include the list of roles they are allowed to perform.

                                      '
                                  password:
                                    type: string
                                    description: 'The user''s password, used for basic authentication or to retrieve a bearer auth (JWT) token. Not available in API responses. Required when creating or updating users.

                                      '
                                  cn:
                                    type: string

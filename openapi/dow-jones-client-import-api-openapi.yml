  /client/import/synchronous:
    post:
      operationId: clientImportSyncronous
      summary: Import a single client synchronously
      description: 'Import or update **one** client record and block until screening has completed, then return

        the current alerts for that client.


        Unlike `POST /client/import`, which accepts a bulk upload and returns immediately with a

        job identifier, this endpoint holds the HTTP connection open until the import job reaches

        `COMPLETE` and assessment counters have caught up. The client is processed through the

        standard client import pipeline using high-priority routing.


        ### Request body


        Submit a **single client JSON object** (not line-delimited JSON). The schema is the same as

        a client record in the bulk import API. Set `assessmentRequired: true` when a full

        screening against current risk data is required.


        ### Response body


        The response contains an `openAlerts` array with the alerts in **OPENED** state

        client, and `monitoringAlerts` array with the alerts in **MONITORING** state for the imported client sorted by creation time descending.


        **Important:** this list includes **all alerts currently associated with the client**, not

        only alerts created or updated by this import request.


        When no alerts exist for the client, the response is `{ "openAlerts": [], "monitoringAlerts": [] }`.


        ### Typical latencies


        End-to-end latency depends on platform load, client complexity, and whether alerting is

        triggered. Measurements below are round-trip times for `POST /client/import/synchronous` with

        **one client per request** and `assessmentRequired: true`.


        #### Development environment conditions


        | Percentile | Latency |

        | :--------- | :------ |

        | Median     | 6.8 s   |

        | Mean       | 6.9 s   |

        | 90th       | 8.6 s   |

        | 95th       | 8.8 s   |

        | 98th       | 8.8 s   |


        **Caveat:** these measurements were taken in the **Development** environment. Production-like

        latency metrics will be collected later based on real usage, as this is a new endpoint.


        A long response time does **not** indicate failure. Successful imports return **`200 OK`**

        regardless of duration.


        ### Throughput limitations and usage guidance


        This endpoint is intended for **interactive, low-volume** client updates (for example, a user

        saving a single client in a UI). It is **not** a substitute for bulk client loading.


        | Guidance | Detail |

        | :------- | :----- |

        | Volume   | **One client per request.** Use `POST /client/import` for bulk or batch uploads. |

        | Rate limit | **90 requests** per 15 minutes time window (`periodicRateLimit`). Exceeding this limit returns **`429 Too Many Requests`**. |

        | Concurrency | **6 concurrent requests** maximum per tenant (`concurrentRateLimit`). Additional in-flight requests receive **`429 Too Many Requests`** until an existing request completes. |

        | Connection | The server holds the connection until processing completes. Do not treat a slow response as an error if the HTTP status is `200`. |

        | Disconnect | If the client closes the connection early, the import job may continue in the background; the client will not receive the response body. |


        `RateLimit` and `RateLimit-Policy` response headers report remaining quota for both policies.

        Plan client applications to stay within **90 requests** and **6 concurrent** calls; higher

        parallelism increases latency even when limits are not exceeded.


        For large data loads use `POST /client/import` and poll `/client/import/{job_id}/status` instead.

        '
      tags:
      - Client Import
      parameters:
      - name: jobname
        in: query
        required: false
        schema:
          type: string
        description: Optional label for the created import job (defaults to "Sync Client Import").
      requestBody:
        required: true
        description: A single client record to import or update.
        content:
          application/json:
            schema:
              description: A client record for import, including optional hash and assessmentRequired fields.
              allOf:
              - type: object
                properties:
                  hash:
                    type: string
                    description: 'An optional hash of the client record. The hash is generated by the client and can be used to reconcile the version of the client stored in the system with versions mastered in the source system. When supplied during import, the hash can later be validated using the `/entity/validate-data` endpoint.

                      '
                  assessmentRequired:
                    type: boolean
                    default: false
                    description: 'When a client is loaded or updated, the assessmentRequired property of the client record can be set to true to request a full screening or re-screening of the Client against the risk data currently in the system at time of loading.

                      If this flag is not set, the client will be loaded or updated, but alerts will only be generated against the client as Risk Profiles and Internal Lists are loaded or updated in the system.

                      If the flag is set, the Client is screened against all existing Risk Profiles and List Entities and Alerts may be generated if any matches meet the alerting criteria in the Alert Policies.

                      '

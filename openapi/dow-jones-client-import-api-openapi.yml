  /client/import/reload:
    post:
      operationId: clientReload
      summary: Reload clients
      description: 'Reloads all clients in the system

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes, and a global concurrent request limit of 5 simultaneous requests per customer.

        '
      tags:
      - Client Import
      responses:
        '200':
          description: A successful client reload operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdJobs:
                    description: The unique identifiers of the created jobs
                    type: array
                    items:
                      type: number
                  reloadedClients:
                    description: The total number of clients reloaded
                    type: number
              example:
                createdJobs:
                - 87
                - 88
                - 89
                - 90
                - 91
                - 92
                reloadedClients: 100088
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (e.g. the user does not have the correct permission)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
  /client/import/search:
    get:
      operationId: clientImportSearch
      summary: Search client import jobs
      description: 'An endpoint used to search client import jobs

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      tags:
      - Client Import
      parameters:
      - name: id
        description: The ID of a client job to search for. This parameter can be specified multiple times to retrieve multiple import jobs.
        in: query
        required: false

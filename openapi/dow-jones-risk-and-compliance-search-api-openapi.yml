      properties:
        codes:
          type: array
          example:
          - AFDB
          - BR-CGU
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array
          example:
          - BRAZ
          items:
            type: string
        is_all_excluded:
          type: boolean

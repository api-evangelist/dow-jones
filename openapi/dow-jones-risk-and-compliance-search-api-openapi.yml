        other_exclusion_list:
          $ref: '#/components/schemas/OtherExclusionListV25'
        state_ownership:
          $ref: '#/components/schemas/StateOwnershipV25'
        occupation_category:
          $ref: '#/components/schemas/OccupationCategoryV25'

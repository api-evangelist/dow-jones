          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        last_review_date:
          $ref: '#/components/schemas/LastReviewDateV25'
        is_meu_active:
          type: boolean
        operator:
          type: string
    DatumV25:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/AttributesResponseV25'
    IconHintVo:
      type: object
      properties:
        icon_hint:
          type: string
          example: SI-PERSON
        status:
          type: string
          example: Active
    RequestAttributesV25:
      type: object
      properties:
        filter_group_and:
          $ref: '#/components/schemas/FilterGroupAndV25'
        filter_group_or:
          $ref: '#/components/schemas/FilterGroupOrV25'
        paging:
          $ref: '#/components/schemas/Paging'
        screening_context:

          type: string
        middle_name:
          type: string
        first_name:
          type: string
        search_type:
          type: string
          enum:
          - Precise
          - Near
          - Broad
    CountryTerritoryTypesV26:
      type: object
      description: Filter to include or exclude codes from CountryTerritoryType list
      properties:
        country_territory_types:
          type: array
          example:
          - '3'
          items:
            type: string
        operator:
          type: string
          enum:
          - OR
    FilterGroupAndV22:
      type: object
      properties:
        group_operator:
          type: string
          enum:
          - AND
        filters:
          $ref: '#/components/schemas/FiltersV22'
    DateObject:
      type: object
      properties:
        month:
          type: string
          example: '1'
        year:
          type: string
          example: '2020'
        day:
          type: string
          example: '1'
    MilitaryEndUseV25:
      type: object
      description: Filter to include or exclude codes from MilitaryEndUseCategories list
      properties:
        codes:
          type: array
          example:
          - '1054'
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array

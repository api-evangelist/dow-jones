          type: array
          example: []
          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        operator:
          $ref: '#/components/schemas/Operator'
    ContentCategoryV25:
      type: object
      properties:
        special_interest:
          $ref: '#/components/schemas/SpecialInterestV25'
        adverse_media:

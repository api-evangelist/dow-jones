            application/vnd.dowjones.dna.riskentities.v_2.1+json:
              schema:
                $ref: '#/components/schemas/ScreeningResponseV2'
            application/vnd.dowjones.dna.riskentities.v_2.0+json:
              schema:
                $ref: '#/components/schemas/ScreeningResponseV20'
        '400':
          description: Bad request
components:
  schemas:
    SanctionsListV24:
      type: object
      description: Filter to include or exclude codes from SanctionLists (SAN)
      properties:
        codes:
          type: array
          example:
          - AE-CAE
          - AR-MOJDH
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array
          example:
          - BRAZ
          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        is_san_active:
          type: boolean
          default: null
        operator:
          $ref: '#/components/schemas/Operator'
    HrfCategoryV26:
      type: object
      description: Filter to include or exclude codes from HighRiskFactor list
      properties:
        codes:
          type: array
          example:
          - '1011'
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array
          example:
          - BRAZ
          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        last_review_date:
          $ref: '#/components/schemas/LastReviewDate'
        is_hrf_active:
          type: boolean
          default: null
        operator:
          type: string
    DataV23:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/RequestAttributesV23'
    MatchedType:
      type: object
      properties:
        is_structural_variation:
          type: boolean
          default: false
        is_non_linguistic_variation:
          type: boolean
          default: false
        type:
          type: string
        is_linguistic_variation:
          type: boolean
          default: false
    OccupationCategoryV25:
      type: object
      description: Filter to include or exclude codes from OccupationCategories list
      properties:
        codes:
          type: array
          example:
          - '18'
          - '6'
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array
          example:
          - BRAZ
          items:
            type: string
        last_review_date:
          $ref: '#/components/schemas/LastReviewDateV25'
        is_all_excluded:
          type: boolean
          default: false
        is_adsr_excluded:
          type: boolean
          default: false
        is_pep_active:
          type: boolean
          default: null
        pep_inactive_date_gte:
          $ref: '#/components/schemas/PepInactiveDateGte'
        operator:
          type: string
    FiltersV22:
      type: object
      properties:
        search_keyword:
          $ref: '#/components/schemas/SearchKeyword'
        country_territory:
          $ref: '#/components/schemas/CountryRequestV1'
        identification:
          $ref: '#/components/schemas/Identification'
        entity_name:
          $ref: '#/components/schemas/EntityName'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        person_name:
          $ref: '#/components/schemas/PersonName'
        record_types:
          type: array
          items:
            type: string
            enum:
            - Person
            - Entity
        content_set:
          type: array
          example:
          - Watchlist
          - Locations
          - StateOwnedCompanies
          - AntiCorruption
          - AdverseMedia
          items:
            type: string
            enum:
            - Watchlist
            - AdverseMedia
            - StateOwnedCompanies
            - AntiCorruption
            - HighRiskFactors
            - Locations
            - TradeCompliance
        gender:
          type: array
          example:
          - male
          - female
          items:
            type: string
            enum:
            - male
            - female
            - unknown
    OccupationCategoryV22:
      type: object
      description: Filter to include or exclude codes from OccupationCategories list
      properties:
        codes:
          type: array
          example:
          - '18'
          - '6'
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        is_adsr_excluded:
          type: boolean
          default: false
        is_pep_active:
          type: boolean
          default: null
        pep_inactive_date_gte:
          $ref: '#/components/schemas/PepInactiveDateGte'
        operator:
          $ref: '#/components/schemas/Operator'
    AttributesResponseV26:
      type: object
      properties:
        type:
          type: string
        primary_name:
          type: string
        title:
          type: string
        country_territory_code:
          type: string
        country_territory_name:
          type: string
        gender:
          type: string
        is_subsidiary:
          type: boolean
          default: false
        score:
          type: string
        countries_territories:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CountryResponse'
            - $ref: '#/components/schemas/CountryResponseIso'
        date_of_birth:
          type: array
          items:
            $ref: '#/components/schemas/DateObjectV26'
        matched_criteria:
          $ref: '#/components/schemas/MatchedCriteriaV26'
        icon_hints:
          type: array
          items:
            $ref: '#/components/schemas/IconHintVo'
        filter_source:
          type: string
    FiltersV24:
      type: object
      properties:
        search_keyword:
          $ref: '#/components/schemas/SearchKeywordV2'
        country_territory:
          $ref: '#/components/schemas/CountryRequestV24'
        identification:
          $ref: '#/components/schemas/Identification'
        entity_name:
          $ref: '#/components/schemas/EntityName'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        person_name:
          $ref: '#/components/schemas/PersonName'
        record_types:
          type: array
          items:
            type: string
            enum:
            - Person
            - Entity
        content_set:
          type: array
          example:
          - Watchlist
          - Locations
          - StateOwnedCompanies
          - AntiCorruption
          - AdverseMedia
          items:
            type: string
            enum:
            - Watchlist
            - AdverseMedia
            - StateOwnedCompanies
            - AntiCorruption
            - HighRiskFactors
            - Locations
            - TradeCompliance
    FiltersV26:
      type: object
      properties:
        search_keyword:
          $ref: '#/components/schemas/SearchKeyword'
        country_territory:
          $ref: '#/components/schemas/CountryRequestV26'
        identification:
          $ref: '#/components/schemas/Identification'
        entity_name:
          $ref: '#/components/schemas/EntityName'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        person_name:
          $ref: '#/components/schemas/PersonName'
        last_review_date:
          $ref: '#/components/schemas/LastReviewDateV26'
        record_types:
          type: array
          items:
            type: string
            enum:
            - Person
            - Entity
        content_set:
          type: array
          example:
          - Watchlist
          - Locations
          - StateOwnedCompanies
          - AntiCorruption
          - TradeRestrictedAssociatedEntity
          items:
            type: string
            enum:
            - Watchlist
            - AdverseMedia
            - StateOwnedCompanies
            - AntiCorruption
            - HighRiskFactors
            - Locations
            - TradeCompliance
            - MilitaryEndUse
            - TradeRestrictedAssociatedEntity
    Paging:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
          example: 10
    MilitaryEndUseV26:
      type: object
      description: Filter to include or exclude codes from MilitaryEndUseCategories list
      properties:
        codes:
          type: array
          example:
          - '1054'
          items:
            type: string
        exclude_codes:
          type: array
          example: []
          items:
            type: string
        without_codes:
          type: array
          example:
          - BRAZ
          items:
            type: string
        is_all_excluded:
          type: boolean
          default: false
        last_review_date:
          $ref: '#/components/schemas/LastReviewDateV26'
        is_meu_active:
          type: boolean
        operator:
          type: string
    AdverseMediaV26:
      type: object
      description: Filter to include or exclude codes from AdverseMediaCategories list
      properties:
        codes:
          type: array
          example:
          - '33'

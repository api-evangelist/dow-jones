        location:
          $ref: '#/components/schemas/LocationV25'
        military_end_use:
          $ref: '#/components/schemas/MilitaryEndUseV25'
    SanctionsListV26:
      type: object
      properties:
        codes:
          type: array
          items:
            type: string

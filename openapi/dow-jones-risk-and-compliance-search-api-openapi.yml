          type: array
          items:
            type: string
        without_codes:
          type: array
          items:
            type: string
        is_all_excluded:
          type: boolean
        last_review_date:
          $ref: '#/components/schemas/LastReviewDate'
        is_san_active:
          type: boolean
        operator:
          type: string
    Identification:
      type: object
      properties:
        number:
          type: string
        type:
          type: string
          description: One of the identification types. Check the IDTYPE list on taxonomy for values
    ScreeningResponseV25:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatumV25'
        meta:
          $ref: '#/components/schemas/MetaAudit'
    LastReviewDate:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/DateObject'
        to:
          $ref: '#/components/schemas/DateObject'
    DatumV24:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/AttributesResponseV24'
    MatchedNameVo:
      type: object

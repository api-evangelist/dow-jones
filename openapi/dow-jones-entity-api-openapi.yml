                    type: number
                  irs:
                    description: Total irs items deleted
                    type: number
                  periodicReview:
                    description: Total periodic review items deleted
                    type: number
                  uploadedClients:
                    description: Total uploaded client items deleted
                    type: number
                  activityCreated:
                    description: Total activity created items deleted

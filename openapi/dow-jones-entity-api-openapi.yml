    delete:
      summary: Delete multiple clients
      description: 'Delete all of the clients specified in the request body. This is a hard delete that deletes the client along with all of their alerts and associated information.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      operationId: entityMultipleDelete
      tags:
      - Entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: A list of the IDs of the clients to delete.
              properties:
                ids:
                  type: array
                  description: List of client ids
                  minItems: 1
                  items:
                    type: string

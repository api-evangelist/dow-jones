  /entity/validate-data:
    post:
      summary: Validate list entity and client data
      description: 'Check the validity of list entity (profile) and client data by comparing the hash stored on the entity with the expected hash in the request. Use the `prefix` parameter to scope validation to list entities or clients.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.


        Hashes must be supplied when loading data (list import API or client import API). Ripjar does not generate hashes; they are supplied by the client to reconcile the version in the system with the source system.

        '
      operationId: entityValidateData
      tags:
      - Entity
      parameters:
      - name: prefix
        in: query
        required: true
        schema:
          type: string
        description: 'The endpoint takes a prefix parameter that defines the prefix used for the key of the entity. Only entities whose key starts with the given prefix will be validated.


          **List entities (profiles):** The keys are generated within the system, and are of the form:

          listEntity:internal:provider:source:<ListEntityId>

          Provider and source are the values provided in the call to the list import API when this entity was loaded. The ListEntityId corresponds to the profileId of the specific list entity. Keys for list entities are automatically prefixed with listEntity, and so to validate list data the query should be: `…/entity/validate-data?prefix=listEntity`


          **Clients:** The keys are generated within the system, and are of the form:

          eoi:<ClientId>

          To validate clients for a given client key, use: `…/entity/validate-data?prefix=eoi`.

          '
      requestBody:
        required: false
        description: 'Line-delimited JSON (NDJSON); each line is a single JSON object describing one entity to validate. Each object must have a `key` (the entity key) and may optionally have a `hash` (the expected hash to compare). See the `DataValidationItem` schema for the structure.

          '
        content:
          text/plain:
            schema:
              description: Newline-delimited JSON, one object per line
              allOf:
              - type: object
                description: Specifies the ID and hash of an entity expected to exist in the system.
                properties:
                  key:
                    type: string
                    description: The ID of the expected entity
                  hash:
                    type: string
                    description: 'The hash value of the expected entity. Optional; when omitted, the endpoint will only check that the entity exists in the system (e.g. for clients that were loaded without a hash).

                      '
                required:
                - key
            examples:
              listEntity:
                summary: List entities (prefix=listEntity)
                description: '**Full request body (NDJSON — one JSON object per line):**


                  ```json

                  { "key": "listEntity:internal:provider:source:listEntity1001", "hash": "sdfuh" }

                  { "key": "listEntity:internal:provider:source:listEntity1002", "hash": "aksjh" }

                  { "key": "listEntity:internal:provider:source:listEntity1004", "hash": "aksjh" }

                  { "key": "listEntity:internal:provider:source:listEntity1004", "hash": "aksjh" }

                  { "key": "listEntity:internal:provider:source:listEntity1005" }

                  ```

                  '
                value:
                  key: listEntity:internal:provider:source:listEntity1001
                  hash: sdfuh
              eoi:
                summary: Clients (prefix=eoi)
                description: '**Full request body (NDJSON — one JSON object per line):**


                  ```json

                  { "key": "eoi:123-4567-1001", "hash": "sdfuh" }

                  { "key": "eoi:123-4567-1002", "hash": "aksjh" }

                  { "key": "eoi:123-4567-1004", "hash": "aksjh" }

                  { "key": "eoi:123-4567-1004", "hash": "aksjh" }

                  { "key": "eoi:123-4567-1005" }

                  ```

                  '
                value:
                  key: eoi:123-4567-1001
                  hash: sdfuh
      responses:
        '200':
          description: 'The data validation response, comprising a list of line-delimited JSON records describing the status of each record.


            **Examples:** Use the response example with the same name as the request body example (`listEntity` or `eoi`) — they are paired for documentation.

            '
          content:
            application/octet-stream:
              schema:
                allOf:
                - type: object
                  description: A record detailing a record that was described in the validation request, or that exists in the system that was not included in the validation request, along with its "./paths/alert/id-status.yaml"
                  properties:
                    code:
                      description: "An HTTP status code describing the status of the record in the system. Codes are represented as follows:\n  200 - The hash for the entity in the system matched the hash supplied\n  400 - The entity Id was duplicated in the validation request\n  404 - The specified entity Id was not found in the system\n  409 - The hash value presented for validation ('hashPresented') did not match the hash value stored in the system ('ourHash')\n  417 - This entity was stored in the system (and had a key that fell within the requested range) but was not present in the validation request\n"
                      type: integer
                      enum:
                      - 200
                      - 400
                      - 404
                      - 409
                      - 417
                    entityId:
                      description: The ID of the entity record that the response relates to.
                      type: string
                    message:
                      description: Message describing details of the validation item.
                      type: string
                    hashPresented:
                      description: The hash value that was provided for the record in the validation request.
                      type: string
                    ourHash:
                      description: The hash value that was present in the system for the version of the record with the given ID.
                      type: string
                  required:
                  - code
                  - entityId
              examples:
                listEntity:
                  summary: Response for listEntity request example
                  description: '**Full response body (NDJSON — one JSON object per line):**


                    ```json

                    { "code": 200, "entityId": "listEntity:internal:provider:source:listEntity1001" }

                    { "code": 409, "entityId": "listEntity:internal:provider:source:listEntity1002", "hashPresented": "aksjh", "ourHash": "ppohs" }

                    { "code": 404, "entityId": "listEntity:internal:provider:source:listEntity1004" }

                    { "code": 400, "entityId": "listEntity:internal:provider:source:listEntity1004", "message": "Entity id is duplicated" }

                    { "code": 200, "entityId": "listEntity:internal:provider:source:listEntity1005" }

                    ```

                    '
                  value:
                    code: 200
                    entityId: listEntity:internal:provider:source:listEntity1001
                eoi:
                  summary: Response for eoi request example
                  description: '**Full response body (NDJSON — one JSON object per line):**


                    ```json

                    { "code": 200, "entityId": "eoi:123-4567-1001" }

                    { "code": 409, "entityId": "eoi:123-4567-1002", "hashPresented": "aksjh", "ourHash": "ppohs" }

                    { "code": 404, "entityId": "eoi:123-4567-1004" }

                    { "code": 400, "entityId": "eoi:123-4567-1004", "message": "Entity id is duplicated" }

                    { "code": 200, "entityId": "eoi:123-4567-1005" }

                    ```

                    '
                  value:
                    code: 200
                    entityId: eoi:123-4567-1001
        '401':
          description: Unauthenticated request
        '403':
          description: Forbidden request
        '500':
          description: An unexpected error occurred during data validation.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
              examples:
                unexpectedError:
                  summary: Unexpected Error
                  value:
                    code: '500'
                    message: An error occurred during data validation.

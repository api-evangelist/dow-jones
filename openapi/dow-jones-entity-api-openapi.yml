  /entity/risk-profile-query:
    post:
      summary: Query full profile details for a list of profile IDs
      description: 'Returns the most recent version of profile records for up to 200 profile IDs in a single request.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.


        <!-- operational-characteristics:start -->


        ### Operational characteristics


        Values below are measured from production traffic. Only collected values are shown.


        *Generated from limited sample size.*


        **Latency distribution**


        Latency values are shown as milliseconds below 1 s, seconds with one decimal place below 1 min, otherwise as M:SS (min).


        | Metric | Value |

        | --- | --- |

        | Median | 79 ms |

        | 90th percentile | 709 ms |

        | 95th percentile | 1.1 s |

        | 98th percentile | 2.2 s |

        | 99th percentile | 2.8 s |

        <!-- operational-characteristics:end -->


        The response is JSON Lines (`application/x-ndjson`) — one JSON object per line, in the same order as the requested `ids`. Each line is either a successful profile entry or an inline error entry (e.g. `NOT_FOUND`, `BAD_ID`); the request as a whole never fails because of an individual lookup miss.

        Example source of IDs for this query: `POST /search/{strategy}` returns `results[].profileId`, which can be passed as `ids` here.


        Duplicate `ids` are rejected with HTTP `400`.


        With `relationships=true`, profiles include `relationships` (`relationshipType`, `profileId`, and `name` only when known). Default is `relationships=false` (no relationship data).


        Ripjar profiles do not return relationships here; when `sourceProfileIds` is present, use an appropriate id from that array for follow-up requests (e.g. linked watchlist profile).


        By default deleted profiles are returned. Pass `retrieveDeleted=false` to return them as `NOT_FOUND` instead.

        '
      operationId: entityRiskProfileQuery
      tags:
      - Entity
      x-operational-characteristics:
        description: 'Operational characteristics from production log analysis (generatedAt: 2026-06-16T10:56:29.271Z).

          '
        latencyDistribution:
          median: 79
          p90: 708.5
          p95: 1053.35
          p98: 2171.64
          p99: 2756.07
          sampleSize: 60
      parameters:
      - in: query
        name: relationships
        required: false
        schema:
          type: boolean
          default: false
        description: 'When `true`, include each profile''s `relationships` (`relationshipType`, `profileId`, optional `name`).

          '
      - in: query
        name: retrieveDeleted
        required: false
        schema:
          type: boolean
          default: true
        description: 'When `false`, deleted profiles are returned as inline `NOT_FOUND` entries instead of being included in the response.

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  description: 'List of profile IDs to retrieve (1–200 entries, non-empty strings, all distinct).

                    '
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    example: listEntity:1234
            examples:
              basicRequest:
                summary: Three Ripjar profile IDs
                value:
                  ids:
                  - listEntity:list_entity-urn:ripjar:kat-rek-kod-kig
                  - listEntity:list_entity-urn:ripjar:wid-sav-yiv-ciq
                  - listEntity:list_entity-urn:ripjar:kiz-pil-nor-tas
      responses:
        '200':
          description: 'One JSON Lines entry per requested ID, in request order. Each line is independently parseable. May contain a mix of successful profiles and inline error entries.


            The **examples** are single lines (one object each); a real response concatenates many such lines separated by newlines.

            '
          content:
            application/x-ndjson:
              schema:
                description: 'A single line of the JSON Lines response. Either a successful profile entry or an inline error entry. Discriminated by the presence of a `profile` or `error` field.

                  '
                oneOf:
                - type: object
                  required:
                  - id
                  - profile
                  properties:
                    id:
                      type: string
                      description: The profile ID as supplied in the request.
                      example: listEntity:1234
                    profile:
                      type: object
                      description: 'A profile record returned by risk-profile-query. Internal fields and `metadata` are stripped from the response.

                        '
                      required:
                      - id
                      properties:
                        id:
                          type: string
                          description: The profile ID.
                          example: listEntity:1234
                        name:
                          type: string
                          description: Display name of the profile.
                        entityType:
                          type: string
                          description: Entity type (e.g. `listPerson`, `listOrganisation`, `listLocation`, `listVessel`, `listAircraft`).
                        sourceProfileIds:
                          type: array
                          items:
                            type: string
                          description: 'Optional. Same values as `metadata.sourceProfileIds` on the source record, copied to the profile root because `metadata` is not returned. Clients choose which id (if any) to use in follow-up requests.

                            '
                          example:
                          - listEntity:list_entity-urn:ripjar:kat-rek-kod-kig
                          - listEntity:list_entity-urn:ripjar:wid-sav-yiv-ciq
                          - listEntity:list_entity-urn:ripjar:kiz-pil-nor-tas
                        relationships:
                          type: array
                          description: Present only when the request was made with `relationships=true`.
                          items:
                            type: object
                            description: 'Relationship type, related profile id, and optional display name for the related profile.

                              '
                            required:
                            - relationshipType
                            - profileId
                            properties:
                              relationshipType:
                                type: string
                                nullable: true
                                description: Type of the relationship (e.g. `spouse`, `affiliate`).
                              profileId:
                                type: string
                                nullable: true
                                description: ID of the related profile (the side of the edge that is not the anchor profile).
                                example: listEntity:5678
                              name:
                                type: string
                                description: Display name of the related profile when available.
                      additionalProperties: true
                - type: object
                  description: 'Inline error entry for a profile that could not be returned. The response will still contain a line for this ID, in the same position as the request.

                    '
                  required:
                  - id
                  - error
                  properties:
                    id:
                      type: string
                      description: The profile ID as supplied in the request.
                      example: listEntity:9999
                    error:
                      type: string
                      description: 'Machine-readable error code identifying why this profile could not be returned.

                        '
                      enum:
                      - NOT_FOUND
                      - BAD_ID
                    message:
                      type: string
                      description: Human-readable detail when supplied (e.g. invalid id format for `BAD_ID`).
              examples:
                successWithRelationships:
                  summary: Success line when relationships=true
                  description: 'Includes two relationships — one without `name`, one with `name`.

                    '
                  value:
                    id: listEntity:1234
                    profile:
                      id: listEntity:1234
                      name: Alice Example
                      entityType: listPerson
                      relationships:
                      - relationshipType: affiliate
                        profileId: listEntity:8888
                      - relationshipType: spouse
                        profileId: listEntity:5678
                        name: Bob Example
                successWithSourceProfileIds:
                  summary: Success line with optional sourceProfileIds
                  value:
                    id: listEntity:list_entity-urn:ripjar:kat-rek-kod-kig
                    profile:
                      id: listEntity:list_entity-urn:ripjar:kat-rek-kod-kig
                      name: Example adverse media entity
                      entityType: listPerson
                      sourceProfileIds:
                      - listEntity:list_entity-urn:ripjar:kat-rek-kod-kig
                      - listEntity:list_entity-urn:ripjar:wid-sav-yiv-ciq
                      - listEntity:list_entity-urn:ripjar:kiz-pil-nor-tas
                inlineNotFound:
                  summary: Inline NOT_FOUND
                  value:
                    id: listEntity:9999
                    error: NOT_FOUND
                inlineBadId:
                  summary: Inline BAD_ID
                  value:
                    id: not-a-profile
                    error: BAD_ID
                    message: Id "not-a-profile" is not a profile id (must start with "listEntity:")
        '400':
          description: 'Bad request (e.g. invalid body, duplicate `ids`, or more than 200 ids).

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
        '500':
          description: 'An unexpected error occurred while fetching the requested profiles. The request did not produce any inline result entries.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
  /entity/client-export:
    post:
      summary: Exports the clients in LS and streams response, optionally filtered by Last Modified Date only
      description: 'Unlike /entity/client-query, this endpoint optionally filters by Last Modified Date only. If Last Modified Date is provided it will return all clients that have been modified since the Last Modified Date. If no Last Modified Date is provided it will return all clients. Unlike /entity/client-query, this endpoint does not filter by any other fields.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes, and a global concurrent request limit of 5 simultaneous requests per customer.


        <!-- operational-characteristics:start -->


        ### Operational characteristics


        Values below are measured from production traffic. Only collected values are shown.


        *Generated from limited sample size.*


        **Latency distribution**


        Latency values are shown as milliseconds below 1 s, seconds with one decimal place below 1 min, otherwise as M:SS (min).


        | Metric | Value |

        | --- | --- |

        | Median | 1.2 s |

        | 90th percentile | 1:36 (min) |

        | 95th percentile | 1:36 (min) |

        | 98th percentile | 1:36 (min) |

        | 99th percentile | 3:02 (min) |

        <!-- operational-characteristics:end -->

        '
      operationId: clientExport
      tags:
      - Entity
      x-operational-characteristics:
        description: 'Operational characteristics from production log analysis (generatedAt: 2026-06-16T10:56:29.271Z).

          '
        latencyDistribution:
          median: 1177.92
          p90: 96184.08
          p95: 96184.08
          p98: 96184.08
          p99: 182949.49
          sampleSize: 266
      requestBody:
        required: false
        content:

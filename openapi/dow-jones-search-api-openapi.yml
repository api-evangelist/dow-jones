            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  description: 'An array of objects equal in length to the number of records in the search

                    request. Each object contains the results for the entity record in the same position

                    in the request array.

                    '
                  type: object
                  required:
                  - results
                  properties:
                    results:
                      type: array
                      minItems: 0
                      items:
                        type: object
                        required:
                        - profileId
                        - score
                        properties:
                          profileId:
                            type: string
                            description: 'Profile identifier for the record this match is for. Can be used

                              in the records endpoint.

                              '
                          score:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            description: 'Normalised matching score modelling the system''s confidence in the match.

                              A score of 0 means the system has no basis on which to believe the match

                              is correct — naturally this should _never_ happen.

                              A score of 1 means the system has full confidence in a match, and this

                              also never happens.

                              However, as more and more pieces of independent evidence contribute

                              to a match, this number geometrically grows closer to 1.

                              '
        '400':

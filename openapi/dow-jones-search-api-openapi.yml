  /search/record/{profileId}:
    get:
      summary: Retrieve a profile record given the ID.
      description: 'The search endpoint returns profile identifiers with their scores.

        This endpoint retrieves the full records for those profiles.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      operationId: searchProfile
      tags:
      - Search
      x-operational-characteristics:
        description: 'Operational characteristics from production log analysis (generatedAt: 2026-06-16T10:56:29.271Z).

          '
        latencyDistribution:
          median: 7
          p90: 7
          p95: 7
          p98: 7
          p99: 7
          sampleSize: 3
      parameters:
      - name: profileId

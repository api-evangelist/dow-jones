                        cessationDateArray:
                          type: array
                          description: For non-active companies, the date(s) on which the company ceased trading
                          items:
                            type: string
                            format: date
                            description: An ISO-8601 compliant date string
                            example: '2023-12-25'
                        keyTerms:
                          type: array
                          description: Keywords used in entity matching to automatically match this list entity to client profiles that contain one or more of the key terms. Viewing the list entity will then show all linked client profiles
                          items:
                            keyTerms:
                              type: string
                - type: object
                  allOf:
                  - type: object
                    required:
                    - profileID
                    - name
                    - activeStatus
                    properties:
                      profileID:
                        type: string
                        description: Unique ID for this profile, used when creating relationships
                      entityType:
                        type: string
                        enum:
                        - listPerson
                        - listAircraft
                        - listLocation
                        - listOrganisation
                        - listVessel
                      name:
                        type: string
                      activeStatus:
                        type: string
                        enum:
                        - Active
                        - Inactive
                        description: Defines whether the entity profile is active or inactive. Typically, entities that are active have anb active membership of at least one active list.
                      identityNumbers:
                        description: Identity numbers associated with the entity, for example Company Identification Number. Each array item consists of a type string that lables the ID number or code and a value string.
                        type: array
                        items:
                          type: object
                          required:
                          - type
                          - value
                          properties:
                            type:
                              type: string
                            value:
                              type: string
                            notes:

  /assessment/{assessment_id}/evidence/{evidence_id}/assess:
    post:
      summary: Assess an item of evidence in an assessment
      description: 'Marks an evidence item as Relevant/Not Relevant based on the assessment code passed in.  Returns the assessed evidence item & activity.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      operationId: assessmentEvidenceAssess
      tags:
      - Assessment
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
      - name: evidence_id
        in: path
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assessmentCodes:
                  type: array
                  required: true
                  items:
                    type: number
                example:
                - 10001
                comment:
                  type: string
                  required: false
      responses:
        '200':
          description: 'Returns the assessed evidence item and activity entry

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  type:
                    type: string
                  matchScore:
                    type: number
                  totalRisk:
                    type: number
                  matchDate:
                    oneOf:
                    - type: string
                      format: date
                      description: An ISO-8601 compliant date string
                      example: '2023-12-25'
                    - type: integer
                      description: Timestamp expressed as the number of milliseconds past the epoch (1970-01-01 00:00:00 UTC)
                  isBookmarked:
                    type: boolean
                    description: indicates whether the evidence is bookmarked by the user
                    example: true
                  assessment:
                    type: object
                    properties:
                      codes:
                        type: array
                        items:
                          type: number
                        description: array of assessment codes. assessment codes are configured by your system administrator.
                        example:
                        - 10001
                      timestamp:
                        type: number
                        description: unix timestamp which indicates when the evidence was assessed
                        example: 1603295488656
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10006
                            email:
                              type: string
                              example: kyc.admin@ripjar.com
                            externalId:
                              type: string
                              example: kyc.admin@ripjar.com
                            cn:
                              type: string
                              example: kyc.admin@ripjar.com
                  isGroupMaster:
                    type: boolean
                  tags:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad request
        '401':
          description: Unauthenticated request
        '403':
          description: Forbidden (e.g. the user does not have the EvidenceAssess permission)
        '404':

        latencyDistribution:
          median: 324.86
          p90: 416.28
          p95: 483.02
          p98: 560.44
          p99: 650.23
          sampleSize: 50464
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:

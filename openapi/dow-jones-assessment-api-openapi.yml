                          type: object
                          description: filter on the publication date
                          required:
                          - gte
                          - lte
                          properties:
                            gte:
                              type: number
                              description: unix timestamp (lower bound)
                              example: 1539954158521
                            lte:
                              type: number
                              description: unix timestamp (upper bound)
                              example: 1603112558521
                    type:
                      type: string
                      description: the type of evidence
                      enum:
                      - risk
                      - list
                      example: risk
                    assessmentCodes:
                      type: array
                      description: an array of assessment codes. assessment codes are defined by your system administrator.
                      items:
                        type: number
                      example:
                      - 10001
                    tags:
                      type: array
                      items:
                        type: string
                      example:
                      - riskType-onList
                    qualification:
                      type: string
                      description: filter by evidence qualification. can be used XOR with assessmentCodes.
                      enum:
                      - not_assessed
                      - relevant
                      - not_relevant
                      - assessed
                      example: not_assessed
                    bookmarked:
                      type: boolean
                      description: filter by bookmarked evidence only
                      example: false
                    isGroupMaster:
                      type: boolean
                      description: filter to only include evidence which are mastered
                      example: false

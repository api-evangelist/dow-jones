                      type: array
                      description: Country codes if assessing unknown entity type
                      items:
                        type: string
                    dateOfBirth:
                      type: string
                      format: date
                      description: Date of birth if assessing a person
                    dateOfIncorporation:
                      type: string
                      format: date
                      description: Date of incorporation if assessing an organisation
                    domicileCodes:
                      type: array
                      description: Domicile codes if assessing a person
                      items:
                        type: string
                    domiciles:
                      type: array
                      description: Domiciles if assessing a person
                      items:
                        type: string
                    entityType:
                      type: string
                      enum:
                      - searchperson
                      - searchorganisation
                      - searchvessel
                      - searchaircraft
                      - searchunknown
                    externalId:
                      type: string
                      description: External identifier for this entity under assessment
                    freeTextItems:
                      type: array
                      description: free-text key-value pairs for the entity
                      items:
                        type: object
                        required:
                        - fieldId
                        - value
                        properties:
                          fieldId:
                            type: string
                            description: The free-text field id (or key)
                          value:
                            type: string
                            description: The free-text field value
                    gender:
                      type: string
                      description: Gender if assessing a person
                      enum:
                      - MALE
                      - FEMALE
                    identityNumbers:
                      type: array
                      description: Identity numbers for the entity
                      items:
                        type: object
                        required:
                        - type
                        - value
                        properties:
                          type:
                            type: string
                            description: The identity number type
                          value:
                            type: string
                            description: The identity number value
                    incorporationCountry:
                      type: string
                      description: Country of incorporation if assessing an organisation
                    incorporationCountryCode:
                      type: string
                      description: Country code for country of incorporation if assessing an organisation
                    name:
                      type: string
                      description: The canonical name of an entity
                    nationalities:
                      type: array
                      description: Nationalities if assessing a person
                      items:
                        type: string
                    nationalityCodes:
                      type: array
                      items:
                        type: string
                      description: Nationality codes if assessing a person
                    screeningReqID:
                      type: string
                      description: The screening request ID
                    vesselCallSigns:

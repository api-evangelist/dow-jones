    delete:
      summary: Bulk delete assessments
      description: '"Request to delete multiple assessments using filters"

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.

        '
      operationId: assessmentBulkDelete
      tags:
      - Assessment
      parameters:
      - name: atSystemHigh
        in: query
        description: Defaults to false if not set
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - description: Delete by filters
                type: object
                allOf:
                - type: object
                  allOf:
                  - not:
                      required:
                      - createdBy
                      - createdByExternalIds
                  - not:
                      required:
                      - assignee
                      - assigneeExternalIds
                  properties:
                    createdBy:
                      description: Filter by created user/s internal ID/s. Cannot be used in conjunction with createdByExternalIds.
                      oneOf:
                      - type: integer
                        description: Filter by created user
                      - type: array
                        description: Filter by created users
                        minItems: 1
                        items:
                          type: integer
                    createdByExternalIds:
                      description: Filter by created user/s external ID/s. Cannot be used in conjunction with createdBy.
                      oneOf:
                      - type: string
                        description: Filter by created user
                      - type: array
                        description: Filter by created users
                        minItems: 1
                        items:
                          type: string
                    status:
                      description: Filter by status code/s
                      oneOf:
                      - type: integer
                        description: Filter by status code
                      - type: array
                        description: Filter by status codes
                        minItems: 1
                        items:
                          type: integer
                    target:
                      description: Filter by targets
                      type: array
                      minItems: 1
                      items:
                        type: string
                    resultStatus:
                      description: Filter by result status codes
                      type: array
                      minItems: 1
                      items:
                        type: number
                    assignee:
                      description: Filter by assignees internal IDs. Cannot be used in conjunction with assigneeExternalIds.
                      type: array
                      minItems: 1
                      items:
                        type: integer
                    assigneeExternalIds:
                      description: Filter by assignees external IDs. Cannot be used in conjunction with assignee.
                      type: array
                      minItems: 1
                      items:
                        type: string
                    alertTags:
                      description: Filter by alert tags
                      type: array
                      minItems: 1
                      items:
                        type: string
                - properties:
                    skip:
                      type: integer
                    limit:
                      type: integer
                    sort:
                      type: object
                      anyOf:
                      - SortCreated:
                          type: object
                          description: Sort by creation date
                          properties:
                            created:
                              type: integer
                              enum:
                              - 1
                              - -1
                      - SortUpdated:
                          type: object
                          description: Sort by last updated date
                          properties:
                            updated:
                              type: integer
                              enum:
                              - 1
                              - -1
              - description: Delete by assessment ids
                allOf:
                - type: object
                  description: Array of ids to delete
                  properties:
                    ids:
                      type: array
                      example:
                      - AS-50
                      - AS-51
                      - AS-75
                      items:
                        type: string
                        minLength: 1
                      minItems: 1
                - properties:
                    skip:
                      type: integer
                    limit:
                      type: integer
                    sort:
                      type: object
                      anyOf:
                      - SortCreated:
                          type: object
                          description: Sort by creation date
                          properties:
                            created:
                              type: integer
                              enum:
                              - 1
                              - -1
                      - SortUpdated:
                          type: object
                          description: Sort by last updated date
                          properties:
                            updated:
                              type: integer
                              enum:
                              - 1
                              - -1
            examples:
              filters:
                value:
                  filter:
                    createdBy:
                    - 100
                    - 200
                    createdByExternalIds:
                    - john.smith@ripjar.com
                    status: 1
                    assignee:
                    - 100
                  skip: 1
                  limit: 2
              ids:
                value:
                  ids:
                  - AS-51
                  - AS-52
                  - AS-70
      responses:
        '200':
          description: Assessment(s) deleted
          content:
            application/json:
              schema:
                description: Delete by filters
                type: object
                properties:
                  success:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Name of deleted items
                          type: string
                          example: entities
                        total:
                          description: Total deleted items
                          type: integer
                  warnings:
                    description: Non fatal errors
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Assessment id relating to the warning
                          type: string
                          example: AS-60
                        value:
                          description: Warning value text
                          type: string
                          example: id does not exist
              example:
                success:
                - name: entities
                  total: 7
                - name: activities
                  total: 1
                - name: attachments
                  total: 1
                - name: assessments
                  total: 1
                warnings: []
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated request
        '403':
          description: The authenticated user cannot delete assessments
        '404':
          description: Assessment(s) not found
        '500':
          description: An unexpected error occurred when deleting assessment
  /assessment/search:

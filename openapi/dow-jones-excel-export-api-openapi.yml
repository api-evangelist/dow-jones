  /excel/export/download/{jobId}:
    get:
      operationId: downloadExcelExport
      summary: Download Excel Export
      description: 'Downloads the completed Excel export file as a ZIP file. Each compressed file will be an Excel workbook - each containing worksheet(s) of up to 500,000 rows each.

        ### Rate Limits


        This endpoint is subject to a general rate limit of 10,000 requests per user per 15 minutes.


        <!-- operational-characteristics:start -->


        ### Operational characteristics


        Values below are measured from production traffic. Only collected values are shown.


        *Generated from limited sample size.*


        **Latency distribution**


        Latency values are shown as milliseconds below 1 s, seconds with one decimal place below 1 min, otherwise as M:SS (min).


        | Metric | Value |

        | --- | --- |

        | Median | 30 ms |

        | 90th percentile | 152 ms |

        | 95th percentile | 300 ms |

        | 98th percentile | 1.3 s |

        | 99th percentile | 1.7 s |

        <!-- operational-characteristics:end -->

        '
      tags:
      - Excel Export
      x-operational-characteristics:
        description: 'Operational characteristics from production log analysis (generatedAt: 2026-06-16T10:56:29.271Z).

          '
        latencyDistribution:
          median: 29.5
          p90: 151.3
          p95: 299.95
          p98: 1348.18
          p99: 1697.59
          sampleSize: 20
      parameters:
      - name: jobId
        in: path
        required: true
        description: The unique identifier of the export job
        schema:
          type: number
          example: 110
      responses:
        '200':
          description: Excel export file downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Excel export file in the appropriate format
        '400':
          description: Bad Request - Invalid export ID
          content:

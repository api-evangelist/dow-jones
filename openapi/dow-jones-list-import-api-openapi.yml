                          cessationDateArray:
                            type: array
                            description: For non-active companies, the date(s) on which the company ceased trading
                            items:
                              type: string
                              format: date
                              description: An ISO-8601 compliant date string
                              example: '2023-12-25'
                          keyTerms:
                            type: array
                            description: Keywords used in entity matching to automatically match this list entity to client profiles that contain one or more of the key terms. Viewing the list entity will then show all linked client profiles
                            items:
                              keyTerms:
                                type: string
                  properties:
                    aircraft:
                      type: object
                      description: 'Aircraft entities are an extension of company entities. As well as the base fields and aircraft-specific fields, all company properties are also included.

                        '
                      properties:
                        name:
                          type: string
                          description: The aircraft's tail number. The prefix of the tail number is used to determine the aircraft's country of origin.
                discriminator:
                  propertyName: entityType
                  mapping:
                    listPerson: ./ListEntityPerson.yaml
                    listAircraft: ./ListEntityAircraft.yaml
                    listLocation: ./ListEntityLocation.yaml
                    listOrganisation: ./ListEntityOrganisation.yaml
                    listVessel: ./ListEntityVessel.yaml
              properties:
                action:
                  type: string
                  description: The action to perform on the list entity - add (or update) or delete
                  enum:
                  - add
                  - del
              required:
              - action
      responses:
        '200':
          description: Entity successfully created/changed
        '401':
          description: Unauthenticated request
        '403':
          description: Forbidden request
        '500':
          description: An unexpected error occurred during list import.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Error code that can be used when contacting support or looking up information
                  message:
                    type: string
                    description: Human-readable description of the error, which will usually indicate possible next steps if applicable
                  status:
                    type: number
                    description: HTTP Error code
              examples:
                unexpectedError:
                  summary: Unexpected Error
                  value:
                    code: '500'
                    message: An error occurred during list import.
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication is the preferred authentication method, and should be used for new integrations.  Contact support to request a service account.
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication is supported for existing users, but is deprecated.  Existing users are encouraged to contact support for a dedicated service account and switch to JWT authentication.

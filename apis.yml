- aid: dow-jones:factiva-analytics
  name: Factiva Analytics APIs
  description: >-
    Snapshots, Streams, Time Series, and Explain endpoints for bulk and streaming access to the Factiva
    news archive (33,000+ sources). Streams delivers events over Google Cloud Pub/Sub subscriptions. Authenticated
    with the user-key header; no public OpenAPI is published for this suite.
  humanURL: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics

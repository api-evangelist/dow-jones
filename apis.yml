description: >-
  Dow Jones is a financial news and information company, publisher of The Wall Street Journal,
  Barron's, MarketWatch, and Dow Jones Newswires, and operator of the Factiva news archive and the
  Risk & Compliance data business. Its Developer Platform (developer.dowjones.com) publishes REST
  APIs for entity screening and monitoring, third-party risk, due-diligence reports, risk profile
  search, and news content (Newswires real-time search, top stories, calendars, newsletters),
  secured by the Dow Jones Identity Service (OAuth 2.0 / OIDC) or Factiva user keys.

standards:
  - id: oauth2
    conforms: true
    evidence: Dow Jones Identity Service implements OAuth 2.0 (authorization code, implicit, resource-owner password for service accounts, refresh token) at accounts.dowjones.com/oauth2/v1/token.
  - id: oidc
    conforms: true
    evidence: OIDC discovery document published at accounts.dowjones.com/.well-known/openid-configuration (issuer sso.accounts.dowjones.com); openid/email/profile-claim scopes supported.
  - id: jwt-bearer-rfc7523
    conforms: true
    evidence: 'AuthZ token exchange uses grant_type urn:ietf:params:oauth:grant-type:jwt-bearer.'
  - id: json-api
    conforms: partial
    evidence: RiskCenter Third Party API responses use JSON:API-style top-level data objects, type members, links and page[limit] pagination; other APIs use bespoke envelopes.
  - id: rfc9457-problem-details
    conforms: false
    evidence: Error responses use JSON errors[] arrays, not application/problem+json.
  - id: media-type-versioning
    conforms: true
    evidence: Resource versions negotiated via custom vnd.dowjones media types in Accept/Content-Type headers.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: Deprecation is communicated via published schedules and monthly product updates, not Sunset headers.
  - id: openapi-3
    conforms: true
    evidence: Sixteen OpenAPI 3.0/3.1 definitions (plus one Swagger 2.0) are published on developer.dowjones.com.
  - id: ietf-ratelimit-headers
    conforms: partial
    evidence: >-
      The Advanced Screening and Monitoring API returns RateLimit and RateLimit-Policy headers
      explicitly declared as conforming to draft-ietf-httpapi-ratelimit-headers-08, plus Retry-After
      on the periodic policy. No other Dow Jones API declares rate-limit headers.
      See rate-limits/dow-jones-rate-limits.yml.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      A vulnerability disclosure program is published at https://www.dowjones.com/security/ (managed by
      Bugcrowd, VDP@dowjones.com) but no security.txt is served on any Dow Jones host — every
      /.well-known/security.txt probed on 2026-08-13 returned 404.
  - id: rfc8615-well-known
    conforms: partial
    evidence: >-
      Only /.well-known/openid-configuration on accounts.dowjones.com returns a document; api-catalog,
      oauth-authorization-server, oauth-protected-resource, ai-plugin.json and agent-card.json all 404
      across every host. See well-known/dow-jones-well-known.yml.
  - id: a2a-agent-card
    conforms: false
    evidence: >-
      No A2A Agent Card is served. /.well-known/agent-card.json and the legacy /.well-known/agent.json

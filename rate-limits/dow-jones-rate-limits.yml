generated: '2026-08-13'
method: searched
source: >-
  https://developer.dowjones.com/documents/site-docs-risk_and_compliance_apis-advanced-screening-and-monitoring-api
  (limits published verbatim in the Dow Jones Advanced Screening and Monitoring API OpenAPI, captured at
  openapi/dow-jones-advanced-screening-and-monitoring-api-openapi.json)
limit_count: 3
summary: >-
  Dow Jones does not publish a platform-wide rate-limit reference page; limits are contractual and
  product-specific. The one API that documents its limits in machine-readable form is the Advanced
  Screening and Monitoring (ASAM) API, whose OpenAPI states a general per-user periodic limit and a
  per-customer concurrency limit, and returns IETF draft-08 RateLimit headers on both success and 429.
  No published numeric limits were found for the Factiva Workflow Toolkit, Newswires, Risk Search,
  Risk Profiles, Due Diligence Reports or RiskCenter Third Party APIs.
limits:
  - id: asam-periodic
    api: dow-jones:advanced-screening-and-monitoring-api
    scope: per-user
    policy_name: periodicRateLimit
    limit: 10000
    window: 15 minutes
    burst: null
    applies_to: Most Advanced Screening and Monitoring API endpoints (applies globally to all API requests).
    source: openapi info.description — "Most endpoints are subject to a general rate limit of 10,000 requests per user per 15 minutes."
  - id: asam-concurrent
    api: dow-jones:advanced-screening-and-monitoring-api
    scope: per-customer
    policy_name: concurrentRateLimit
    limit: 5
    window: concurrent (in-flight requests, not a time window)
    burst: null
    applies_to: A subset of potentially long-running Advanced Screening and Monitoring endpoints.
    source: openapi info.description — "Some endpoints are also subject to a global concurrent request limit of 5 simultaneous requests per customer."
  - id: asam-client-import-synchronous
    api: dow-jones:advanced-screening-and-monitoring-api
    operation: clientImportSyncronous
    path: POST /client/import/synchronous
    scope: per-tenant
    limit: 90
    window: 15 minutes
    concurrency: 6
    applies_to: >-
      Interactive, low-volume single-client import. Documented as not a substitute for bulk client
      loading; use POST /client/import for batch uploads.
    source: openapi operation description (Throughput limitations and usage guidance table)
headers:
  standard: IETF draft-ietf-httpapi-ratelimit-headers-08
  spec_url: https://datatracker.ietf.org/doc/html/draft-ietf-httpapi-ratelimit-headers-08
  returned:
    - name: RateLimit
      description: Current usage for the applicable policy.
      examples:
        - '"concurrentRateLimit"; r=99; t=2836'
        - '"periodicRateLimit"; r=9999998; t=3595'
    - name: RateLimit-Policy
      description: The applicable rate-limit policy (quota q, window w in seconds, partition key pk).
      examples:
        - '"concurrentRateLimit"; q=1000000; w=3600; pk=:REDACTED_PARTITION_KEY:'
        - '"periodicRateLimit"; q=10000000; w=3600; pk=:REDACTED_PARTITION_KEY:'
    - name: Retry-After
      description: Seconds until the limit resets. Only applies to the periodic rate-limit policy.
      type: integer
exhaustion:
  status: 429
  error_envelope:
    code: RATE_LIMIT_EXCEEDED
    message: Rate limit exceeded
    status: 429
  alternate_envelope:
    note: The client-export endpoint returns a different 429 body shape.
    fields:
      - error (string, e.g. "Too many requests, please try again later")
      - retryAfter (integer, seconds)
  operations_declaring_429:
    - POST /client/import/synchronous (clientImportSyncronous)
    - POST /entity/client-export (clientExport)
escalation: >-
  "Please contact support if these rate limit quotas are inappropriate for your usage." — quotas are
  adjustable per contract via Dow Jones developer support.
gaps:
  - No platform-wide rate-limit documentation page was found on developer.dowjones.com.
  - >-
    Sixteen of the seventeen captured OpenAPI definitions declare no 429 response and no RateLimit
    headers, so an agent calling the Factiva, Newswires or Risk & Compliance 2.0 APIs has no runtime
    limit signal to read.

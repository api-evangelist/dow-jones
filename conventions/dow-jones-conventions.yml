    RiskCenter Third Party API uses JSON:API-style page[limit] query parameters; Screening and
    Monitoring and Content APIs use offset/limit-style parameters documented per endpoint.
error_envelope:
  shape: 'JSON body with an errors[] array; RCTP responses wrap resources in a top-level data object with links (JSON:API-style)'
  artifact: errors/dow-jones-problem-types.yml
idempotency:
  supported: false
  note: No idempotency-key contract is documented for the Dow Jones APIs (July 2026).
request_tracing: null
rate_limits:
  note: >-
    Limits are contractual and product-specific; no platform-wide rate-limit reference page is
    published on the developer portal. The Advanced Screening and Monitoring API is the exception —
    its OpenAPI publishes a 10,000-requests-per-user-per-15-minutes periodic limit, a 5-concurrent-
    requests-per-customer limit, and IETF draft-08 RateLimit / RateLimit-Policy / Retry-After response
    headers with a 429 RATE_LIMIT_EXCEEDED envelope.
  signaling: RateLimit, RateLimit-Policy, Retry-After (draft-ietf-httpapi-ratelimit-headers-08)
  exhaustion_status: 429
  artifact: rate-limits/dow-jones-rate-limits.yml
webhooks:
  detail: RiskCenter Third Party API sends webhook notifications when a third party's risk status changes.
